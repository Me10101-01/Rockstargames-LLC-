# Rockstar Creator Development Configuration
# Environment: Production

[system]
version = 1.0.0
environment = production

[storage]
# Data storage paths
crews_path = /var/data/rockstar/crews
creators_path = /var/data/rockstar/creators
production_path = /var/data/rockstar/production/crews

[crew_settings]
# Crew configuration limits
max_crew_name_length = 50
min_crew_name_length = 3
crew_tag_length = 4
default_max_members = 1000
max_crew_members = 10000

[creator_settings]
# Creator permissions and roles
default_role = creator
require_email_verification = true
allow_multiple_crews = true

[pipeline]
# Pipeline configuration
validation_enabled = true
auto_backup = true
deployment_approval_required = true

[logging]
log_level = WARNING
log_file = /var/log/rockstar/crew_system.log
