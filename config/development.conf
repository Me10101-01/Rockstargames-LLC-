# Rockstar Creator Development Configuration
# Environment: Development

[system]
version = 1.0.0
environment = development

[storage]
# Data storage paths
crews_path = ./data/crews
creators_path = ./data/creators
production_path = ./data/production/crews

[crew_settings]
# Crew configuration limits
max_crew_name_length = 50
min_crew_name_length = 3
crew_tag_length = 4
default_max_members = 1000
max_crew_members = 10000

[creator_settings]
# Creator permissions and roles
default_role = creator
require_email_verification = true
allow_multiple_crews = true

[pipeline]
# Pipeline configuration
validation_enabled = true
auto_backup = true
deployment_approval_required = false

[logging]
log_level = INFO
log_file = ./logs/crew_system.log
